<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillBound: Infinite Mystery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              gray: {
                750: '#2d3748',
                850: '#1a202c',
                950: '#0d1117',
              },
              skill: {
                athletics: '#3b82f6', // blue
                combat: '#ef4444',    // red
                perception: '#eab308', // yellow
                recovery: '#22c55e',   // green
                arcana: '#a855f7',     // purple
                survival: '#f97316',   // orange
                weaponry: '#94a3b8',   // slate (steel)
                defense: '#6366f1',    // indigo (armor)
                jewelry: '#ec4899',    // pink (magic items)
                amulet_mastery: '#c026d3', // fuchsia
                luck: '#10b981',       // emerald
                cooking: '#854d0e',    // brown/dark gold
                reader: '#818cf8',     // indigo
                alchemy: '#14b8a6',    // teal
                fist: '#78716c',       // stone
                // Materials
                woodworking: '#7c2d12', // oak brown
                blacksmithing: '#525252', // iron gray
                steelworks: '#60a5fa', // blue steel
                goldsmithing: '#fbbf24', // gold
                mythril_mastery: '#22d3ee', // cyan
                vorpal_affinity: '#4c1d95', // deep purple
                // Magic
                fire_magic: '#f97316', // orange-500
                ice_magic: '#06b6d4',  // cyan-500
                electric_magic: '#eab308', // yellow-500
                earth_magic: '#654321', // dark brown
                water_magic: '#1d4ed8', // dark blue
                light_magic: '#fef08a', // pale yellow
                dark_magic: '#581c87', // deep purple/black
              }
            },
            fontFamily: {
              mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'Liberation Mono', 'Courier New', 'monospace'],
            },
            animation: {
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'fade-in': 'fadeIn 0.5s ease-out',
              'slide-up': 'slideUp 0.3s ease-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(10px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              }
            }
          },
        },
      }
    </script>
    <style>
      body {
        background-color: #0d1117;
        color: #e2e8f0;
        overflow: hidden; /* App handles scrolling */
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1a202c; 
      }
      ::-webkit-scrollbar-thumb {
        background: #4a5568; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #718096; 
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "uuid": "https://aistudiocdn.com/uuid@^13.0.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
